<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Orbital Viewer</title>
    <style>
      body { font-family: "Times New Roman"; margin: 2em; background: black; color: azure; }
      .electron-btn { margin: 0.25em; padding: 0.5em 1em; cursor: pointer; }
      .electron-btn.selected { background: blue; color: black; font-weight: bold; }
      .energy-label { margin: 0.75em 0; font-size: 1.2em; }
      .slider-row { display: flex; align-items: center; gap: 1em; margin-bottom: 1em; }
      canvas { border: 1px solid darkgray; image-rendering: pixelated; }
    </style>
  </head>
<body>
  <h1>Orbital Viewer</h1>

  <script src="output.json.js"></script>

  <orbital-viewer></orbital-viewer>

  <script src="viewer.js"></script>

  <script>
    customElements.whenDefined("orbital-viewer").then(() => {
      const viewer = document.querySelector("orbital-viewer");
      viewer.data = window.ELECTRONS;   // JSON is already loaded
    });
  </script>

  </body>
</html>
